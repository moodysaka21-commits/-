name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform Files
        run: flutter create . --platforms=android --project-name=azkar_app

      - name: Change App Name
        run: |
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('android:label=\"azkar_app\"', 'android:label=\"زاد الذاكرين\"')
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-App
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-App
          path: build/app/outputs/flutter-apk/app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: Azkar-App
          path: build/app/outputs/flutter-apk/app-release.apk
